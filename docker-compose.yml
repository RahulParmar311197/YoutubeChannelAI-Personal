services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: channelai
      POSTGRES_PASSWORD: channelai
      POSTGRES_DB: channelai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./apps/api
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
    volumes: ["./apps/api:/app"]

  worker:
    build: ./apps/worker
    env_file: .env
    depends_on: [redis]
    volumes: ["./apps/worker:/app"]

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["3000:3000"]
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
